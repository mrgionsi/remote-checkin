name: Activity retention cleanup

on:
  schedule:
    - cron: '15 3 * * *'
  workflow_dispatch:

jobs:
  cleanup-activity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run activity retention cleanup
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ACTIVITY_RETENTION_DAYS: ${{ secrets.ACTIVITY_RETENTION_DAYS }}
          ACTIVITY_MAX_ROWS: ${{ secrets.ACTIVITY_MAX_ROWS }}
        run: |
          if [ -z "${DATABASE_URL}" ]; then
            echo "DATABASE_URL secret is not set. Skipping cleanup."
            exit 0
          fi
          PYTHONPATH=backend python backend/scripts/cleanup_activity_events.py
