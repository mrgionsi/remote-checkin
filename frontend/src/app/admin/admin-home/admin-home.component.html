<div class="admin-shell">
    <!-- Show loading until component is initialized -->
    <div *ngIf="!isInitialized" class="admin-loading">
        <div class="spinner"></div>
        <div class="admin-loading__text">Loading...</div>
    </div>

    <!-- Show content only when initialized -->
    <div *ngIf="isInitialized">
        <!-- Admin interface for authenticated users -->
        <div *ngIf="isAuthenticated" class="admin-authenticated">
            <div class="admin-header" *ngIf="!isLoginPage()">
                <button pButton label="Menu" (click)="toggleSidebar()" class="admin-header__menu">☰</button>
                <p-select [options]="structures" optionLabel="name" optionValue="id" [(ngModel)]="selectedStructureId"
                    (onChange)="onStructureChange($event)" [placeholder]="'select-structure-placeholder' | transloco"
                    styleClass="structure-select" *ngIf="structures.length > 0">
                </p-select>
                <div class="user-area">
                    <span>{{ 'hello-label' | transloco }}, {{ userName }}</span>
                    <button pButton icon="pi pi-user" class="user-btn" (click)="toggleUserMenu($event)"></button>
                    <p-menu #userMenu [popup]="true" [model]="userMenuItems"></p-menu>
                </div>
            </div>

            <p-sidebar *ngIf="!isLoginPage()" [(visible)]="visible" [baseZIndex]="10000" [showCloseIcon]="true">
                <div class="admin-sidebar__brand">
                    <img src="assets/brand/logo-256.png" alt="Remote Check-in" />
                    <div class="admin-sidebar__title">{{ 'admin-panel-title' | transloco }}</div>
                </div>
                <div class="admin-sidebar__quick">
                    <div class="admin-sidebar__quick-title">{{ 'admin-menu-quick-actions' | transloco }}</div>
                    <p-button [label]="'admin-quick-create-reservation' | transloco" icon="pi pi-plus"
                        routerLink="/admin/create-reservation" styleClass="admin-quick-btn"></p-button>
                </div>
                <p-menu [model]="menuItems"></p-menu>
            </p-sidebar>

            <div class="admin-content">
                <router-outlet></router-outlet>
            </div>
        </div>

        <div *ngIf="!isAuthenticated" class="admin-unauthenticated">
            <router-outlet></router-outlet>
        </div>
    </div>
</div>
