<div class="container">
    <div class="card">
        <div class="brand">
            <img class="admin-logo" src="assets/brand/logo-vertical.png" alt="Remote Check-in" />
            <h2 class="title">Login Admin</h2>
            <p class="subtitle">Accedi al pannello di gestione.</p>
        </div>
        <div class="p-card-body">
            <form (ngSubmit)="onLogin()" #loginForm="ngForm">
                <div class="p-field">
                    <label for="username">Username</label>
                    <input id="username" type="text" pInputText [(ngModel)]="username" name="username" required />
                </div>
                <div class="p-field password-field">
                    <label for="password">Password</label>
                    <input id="password" [type]="showPassword ? 'text' : 'password'" pInputText [(ngModel)]="password"
                        name="password" required />
                    <i class="pi" [ngClass]="showPassword ? 'pi-eye-slash' : 'pi-eye'"
                        (click)="showPassword = !showPassword"
                        [attr.aria-label]="showPassword ? 'Nascondi password' : 'Mostra password'" tabindex="0"></i>
                </div>
                <button pButton type="submit" label="Login" [disabled]="!loginForm.form.valid">Login</button>
            </form>
        </div>
    </div>
</div>
<p-toast></p-toast>
