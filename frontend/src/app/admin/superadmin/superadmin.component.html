<!-- Loading state -->
<div *ngIf="!isInitialized"
  style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background-color: #f5f5f5;">
  <div class="spinner"
    style="width: 40px; height: 40px; border: 4px solid #f3f3f3; border-top: 4px solid #3498db; border-radius: 50%; animation: spin 1s linear infinite;">
  </div>
  <div style="margin-top: 16px; font-size: 1.2em; color: #555;">Loading Superadmin Panel...</div>
</div>

<!-- Main superadmin interface -->
<ng-container *ngIf="isInitialized">
  <div class="superadmin-container">
    <div class="superadmin-header">
      <h1>Superadmin Panel</h1>
      <p>Manage structures, users, and associations</p>
    </div>

    <nav class="superadmin-nav">
      <a routerLink="/admin/superadmin/dashboard" routerLinkActive="active" class="nav-link">
        <i class="pi pi-chart-bar"></i>
        Dashboard
      </a>
      <a routerLink="/admin/superadmin/structures" routerLinkActive="active" class="nav-link">
        <i class="pi pi-building"></i>
        Structures
      </a>
      <a routerLink="/admin/superadmin/users" routerLinkActive="active" class="nav-link">
        <i class="pi pi-users"></i>
        Users
      </a>
      <a routerLink="/admin/superadmin/associations" routerLinkActive="active" class="nav-link">
        <i class="pi pi-link"></i>
        Associations
      </a>
    </nav>

    <div class="superadmin-content">
      <router-outlet></router-outlet>
    </div>
  </div>
</ng-container>

<style>
  @keyframes spin {
    0% {
      transform: rotate(0deg);
    }

    100% {
      transform: rotate(360deg);
    }
  }
</style>
