<!-- Loading state -->
<div *ngIf="!isInitialized" class="superadmin-loading">
  <div class="spinner"></div>
  <div class="loading-text">Loading Superadmin Panel...</div>
</div>

<!-- Main superadmin interface -->
<ng-container *ngIf="isInitialized">
  <div class="superadmin-shell">
    <div class="superadmin-hero">
      <div class="hero-copy">
        <span class="hero-eyebrow">Superadmin</span>
        <h1>Operations control for your portfolio</h1>
        <p>Monitor activity, manage structures, and keep access aligned in one place.</p>
      </div>
      <div class="hero-actions">
        <a routerLink="/admin/superadmin/structures" class="ghost-action">
          <i class="pi pi-building"></i>
          New structure
        </a>
        <a routerLink="/admin/superadmin/users" class="primary-action">
          <i class="pi pi-user-plus"></i>
          New user
        </a>
      </div>
    </div>

    <nav class="superadmin-nav">
      <a routerLink="/admin/superadmin/dashboard" routerLinkActive="active" class="nav-link">
        <i class="pi pi-chart-bar"></i>
        Dashboard
      </a>
      <a routerLink="/admin/superadmin/structures" routerLinkActive="active" class="nav-link">
        <i class="pi pi-building"></i>
        Structures
      </a>
      <a routerLink="/admin/superadmin/users" routerLinkActive="active" class="nav-link">
        <i class="pi pi-users"></i>
        Users
      </a>
      <a routerLink="/admin/superadmin/associations" routerLinkActive="active" class="nav-link">
        <i class="pi pi-link"></i>
        Associations
      </a>
    </nav>

    <div class="superadmin-content">
      <router-outlet></router-outlet>
    </div>
  </div>
</ng-container>
