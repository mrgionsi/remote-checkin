<div class="associations">
  <div class="associations-header">
    <h2>User-Structure Associations</h2>
    <button class="btn btn-primary" (click)="openCreateModal()">Create Association</button>
  </div>
  
  <div class="filters">
    <select [(ngModel)]="userFilter" (change)="loadAssociations()" class="filter-select">
      <option value="">All Users</option>
      <option *ngFor="let user of users" [value]="user.id">{{ user.name }} {{ user.surname }}</option>
    </select>
    <select [(ngModel)]="structureFilter" (change)="loadAssociations()" class="filter-select">
      <option value="">All Structures</option>
      <option *ngFor="let structure of structures" [value]="structure.id">{{ structure.name }}</option>
    </select>
  </div>
  
  <div class="associations-list" *ngIf="!loading">
    <div class="association-card" *ngFor="let association of associations">
      <div class="association-info">
        <div class="user-info">
          <h4>{{ association.user.name }} {{ association.user.surname }}</h4>
          <p><strong>Username:</strong> {{ association.user.username }}</p>
        </div>
        <div class="structure-info">
          <h4>{{ association.structure.name }}</h4>
          <p><strong>City:</strong> {{ association.structure.city }}</p>
        </div>
      </div>
      <div class="association-actions">
        <button class="btn btn-sm btn-danger" (click)="deleteAssociation(association)">
          Remove
        </button>
      </div>
    </div>
  </div>
  
  <div class="loading" *ngIf="loading">
    <p>Loading associations...</p>
  </div>
  
  <div class="error" *ngIf="error">
    <p>Error: {{ error }}</p>
  </div>
  
  <div class="no-data" *ngIf="!loading && associations.length === 0">
    <p>No associations found</p>
  </div>
</div>

<!-- Create Association Modal -->
<div class="modal" *ngIf="showModal" (click)="closeModal()">
  <div class="modal-content" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h3>Create Association</h3>
      <button class="close-btn" (click)="closeModal()">&times;</button>
    </div>
    <form (ngSubmit)="createAssociation()" #associationForm="ngForm">
      <div class="form-group">
        <label for="userId">User *</label>
        <select 
          id="userId" 
          name="userId" 
          [(ngModel)]="associationFormData.user_id" 
          required 
          class="form-control">
          <option value="">Select a user</option>
          <option *ngFor="let user of users" [value]="user.id">
            {{ user.name }} {{ user.surname }} ({{ user.username }})
          </option>
        </select>
      </div>
      <div class="form-group">
        <label for="structureId">Structure *</label>
        <select 
          id="structureId" 
          name="structureId" 
          [(ngModel)]="associationFormData.structure_id" 
          required 
          class="form-control">
          <option value="">Select a structure</option>
          <option *ngFor="let structure of structures" [value]="structure.id">
            {{ structure.name }} ({{ structure.city }})
          </option>
        </select>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-secondary" (click)="closeModal()">Cancel</button>
        <button type="submit" class="btn btn-primary" [disabled]="!associationForm.form.valid">
          Create Association
        </button>
      </div>
    </form>
  </div>
</div>
